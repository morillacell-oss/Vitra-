name: VITRA Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: vitra-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
